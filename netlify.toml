[build]
  publish = "."

# Netlify routing: proxies backend API to the live cloud engine
# (Placeholder: replace with your backend service URL upon deployment)
[[redirects]]
  from = "/api/*"
  to = "https://ductfit-pro-api.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page App routing for HTML5 pushState
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
