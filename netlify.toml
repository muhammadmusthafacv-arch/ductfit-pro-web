[build]
  publish = "."

# High-performance static routing for catalog tree and version
[[redirects]]
  from = "/api/tree"
  to = "/api_tree.json"
  status = 200
  force = true

[[redirects]]
  from = "/api/version"
  to = "/version.json"
  status = 200
  force = true

[[redirects]]
  from = "/api/projects"
  to = "/api_projects.json"
  status = 200
  force = true

# Single Page App fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
