[build]
  publish = "."

# Neutralize Netlify HUD / Powered by Netlify badge script
[[redirects]]
  from = "/.netlify/scripts/hud*"
  to = "/empty.js"
  status = 200
  force = true

# High-performance static routing for catalog tree, version, and projects
[[redirects]]
  from = "/api/tree"
  to = "/api_tree.json"
  status = 200
  force = true

[[redirects]]
  from = "/api/version"
  to = "/version.json"
  status = 200
  force = true

[[redirects]]
  from = "/api/projects"
  to = "/api_projects.json"
  status = 200
  force = true

# Single Page App fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
